# Mosquitto configuration for the Raspberry Pi gateway broker.
# Copy to /etc/mosquitto/conf.d/iot-gateway.conf and restart the service.

# No anonymous access anywhere.
allow_anonymous false
password_file /etc/mosquitto/passwd

# Plain listener for the local LAN (ESP32 nodes, gateway service).
# Bind to the LAN address if you do not want it exposed on every interface.
listener 1883
# bind_address 192.168.1.10

# TLS listener for anything crossing an untrusted network.
listener 8883
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
